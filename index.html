<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GaMon - Raportare Cetățeni</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: antiquewhite; }
        .container { display: flex; gap: 50px; max-width: 1200px; margin: 0 auto; }
        .coloana-stanga, .coloana-dreapta { flex: 1; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
        select { background-color: #afffaf; cursor: pointer; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #218838; transform: scale(1.02); }
        .btn-primarie { display: block; text-align: center; background-color: #495057; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 25px; transition: all 0.3s; }
        .btn-primarie:hover { background-color: #343a40; }
        .campion-banner { background: linear-gradient(135deg, #ffd700, #ffb300); color: #000; padding: 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .rand-tabel { display: flex; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .eticheta-zona { width: 180px; font-weight: bold; font-size: 14px; }
        .spatiu-bara { flex: 1; margin: 0 15px; }
        .bara-totala { height: 20px; background-color: #e0e0e0; display: flex; border-radius: 4px; overflow: hidden; }
        .felie-albastra { height: 100%; background-color: #007bff; }
        .felie-verde { height: 100%; background-color: #28a745; }
        .total-text { width: 40px; text-align: right; font-weight: bold; }
        .ascuns { display: none !important; }
        .buton-afisare { background: #6c757d; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="coloana-stanga">
        <h2>Raportează un incident</h2>
        <form id="reportForm">
            <label>Oraș:</label><select id="oras"></select>
            <label>Cartier:</label><select id="cartier"></select>
            <label>Zonă Depozitare:</label><select id="zona_depozitare"></select>
            <label>Categorie deșeuri:</label>
            <select id="categorie">
                <option value="Menajer">Menajer</option>
                <option value="Hartie">Hârtie / Carton</option>
                <option value="Plastic">Plastic / Metal</option>
            </select>
            <button type="submit">Trimite Raport</button>
        </form>
        <a href="login.html" class="btn-primarie">Autentificare Administrație ➔</a>
    </div>
    <div class="coloana-dreapta">
        <h2>Rapoarte Live pe Zone</h2>
        <div id="tabel-live">Se încarcă datele...</div>
    </div>
</div>

<script>
    let structuraLocatii = {};

    async function init() {
        const res = await fetch('api.php?action=get_locations');
        structuraLocatii = await res.json();

        const orasSelect = document.getElementById('oras');
        orasSelect.innerHTML = '';
        Object.keys(structuraLocatii).forEach(o => {
            orasSelect.innerHTML += `<option value="${o}">${o}</option>`;
        });

        orasSelect.addEventListener('change', () => { actualizeazaCartiere(); loadLiveTable(); });
        document.getElementById('cartier').addEventListener('change', actualizeazaZone);

        actualizeazaCartiere();
        loadLiveTable();
    }

    function actualizeazaCartiere() {
        const oras = document.getElementById('oras').value;
        const cartierSelect = document.getElementById('cartier');
        cartierSelect.innerHTML = '';
        if(!structuraLocLocations[oras]) return;
        Object.keys(structuraLocatii[oras]).forEach(c => {
            cartierSelect.innerHTML += `<option value="${c}">${c}</option>`;
        });
        actualizeazaZone();
    }

    function actualizeazaZone() {
        const oras = document.getElementById('oras').value;
        const cartier = document.getElementById('cartier').value;
        const zonaSelect = document.getElementById('zona_depozitare');
        zonaSelect.innerHTML = '';
        if(!structuraLocatii[oras] || !structuraLocatii[oras][cartier]) return;
        structuraLocatii[oras][cartier].forEach(z => {
            zonaSelect.innerHTML += `<option value="${z}">${z}</option>`;
        });
    }

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            oras: document.getElementById('oras').value,
            cartier: document.getElementById('cartier').value,
            zona_depozitare: document.getElementById('zona_depozitare').value,
            categorie: document.getElementById('categorie').value
        };
        const res = await fetch('api.php?action=add', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
        });
        const result = await res.json();

        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerText = "Trimis! " + result.message;
        setTimeout(() => { btn.innerText = "Trimite Raport"; loadLiveTable(); }, 2000);
    });

    async function loadLiveTable() {
        try {
            const res = await fetch('api.php?action=live_table&nocache=' + Date.now());
            const dataToate = await res.json();
            const tabelDiv = document.getElementById('tabel-live');
            tabelDiv.innerHTML = '';

            const orasCurent = document.getElementById('oras').value;
            const data = dataToate.filter(item => item.oras === orasCurent);

            if(data.length === 0) {
                tabelDiv.innerHTML = '<p>Nu sunt rapoarte înregistrate aici.</p>';
                return;
            }

            // Banner campion
            let rapoarteC = {};
            data.forEach(i => { rapoarteC[i.cartier] = (rapoarteC[i.cartier] || 0) + parseInt(i.nerezolvate); });
            let campion = Object.keys(rapoarteC).reduce((a, b) => rapoarteC[a] < rapoarteC[b] ? a : b);

            tabelDiv.innerHTML = `<div class="campion-banner">🏆 Campionul curățeniei: <span>${campion.toUpperCase()}</span></div>`;

            const listaZone = document.createElement('div');
            const maxTotal = data[0].total;

            data.forEach((item, index) => {
                const r = document.createElement('div');
                r.className = 'rand-tabel';
                if(index >= 10) r.classList.add('rand-ascuns', 'ascuns');

                r.innerHTML = `
                        <div class="eticheta-zona">${item.zona_depozitare}<div style="font-size:11px;color:#777;">${item.cartier}</div></div>
                        <div class="spatiu-bara">
                            <div class="bara-totala" style="width: ${(item.total/maxTotal)*100}%;">
                                <div class="felie-albastra" style="width: (item.nerezolvate/item.total)*100}%"></div>
                                <div class="felie-verde" style="width: (item.rezolvate/item.total)*100}%"></div>
                            </div>
                        </div>
                        <div class="total-text">${item.total}</div>`;
                listaZone.appendChild(r);
            });
            tabelDiv.appendChild(listaZone);
        } catch(e) { console.log(e); }
    }

    window.onload = init;
</script>
</body>
</html>

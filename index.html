<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width"  initial-scale="1.0">
    <title>GaMon - Raportare Cetățeni </title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
            background: antiquewhite;
        }
        .container {
            display: flex;
            gap:50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .coloana-stanga{
            flex: 1;
            background: white;
            padding: 30px;
            border-radius:8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .coloana-dreapta{
            flex: 1;
            background: white;
            padding: 30px;
            border-radius:8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select,button {
            width: 100%;
            padding: 12px;
            margin: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        select{
            padding:12px 15px;
            background-color: #afffaf;
            font-size:15px;
            color:#333;
            cursor:pointer;
            appearance:none;
            background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat:no-repeat;
            bacground-position:right 15px center;
            background-size:16px;
            transition: all 0.2s ease;
        }

        select:focus{
            outline:none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.2);
            background-color: #fff;
        }

        .campion-banner{
            background: linear-gradient(135deg, #ffd700, #ffb300);
            color: #000;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 16px;
        }

        .buton-afisare{
            background:#6c757d;
            margin-top:15px;
        }

        .buton-afisare:hover{
            background: #5a6268;
            transfoem: scale(1.01);
        }
        .ascuns{
            display:none !important;
        }

        button{
            background:#28a745;
            color: white;
            border: none;
            font-weight: bold;
            cursor:pointer;
            transition: all 0.3s ease-in-out;
        }
        button:hover{
            background: #218838;
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h2{
            color: #333;
            margin-top: 0;
        }
        /* ===LIVE TABLE=== */
        .rand-tabel{
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .eticheta-zona {
            width: 180px;
            font-weight: bold;
            font-size: 14px;
        }

        .spatiu-bara{
            flex:1;
            margin:0 15px;
            display: flex;
            align-items:center;
        }

        .bara-totala {
            height: 20px;
            background-color: #e0e0e0;
            display: flex;
            border-radius: 4px;
            overflow: hidden;
        }
        .felie-albastra {
            height: 100%;
            background-color: #007bff;
            transition: width 0.3s;
        }
        .felie-verde {
            height: 100%;
            background-color: #28a745;
            transition: width 0.3s;
        }

        .total-text {
            width: 40px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        .titlu-cartier {
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #ddd;
            color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="coloana-stanga"id ="form-shell"> Loading Form </div>
        <div class="coloana-dreapta">
            <h2>Rapoarte Live pe Zone</h2>
            <div id="tabel-live"> Loading Data </div>
        </div>
    </div>

    <script>
        const structuraLocatii = {
            "Iași": {
                 "Copou": ["Punct Colectare Codrescu", "Punct Colectare Triumf", "Misc / Ilegal"],
                 "Tătărași": ["Punct Colectare Dispecer", "Punct Colectare Ateneu", "Misc / Ilegal"],
                 "Centru": ["Punct Colectare Sf. Lazăr", "Punct Colectare Palas", "Misc / Ilegal"]
           },
           "Pașcani": {
                "Centru": ["Punct Colectare Gară", "Misc / Ilegal"],
               "Suburbie": ["Punct Colectare Principal", "Misc / Ilegal"]
            }
        };

        function renderForm() {
            const formShell = document.getElementById('form-shell');
            formShell.innerHTML = `
                <h2>Raportează un incident</h2>
                <form id="reportForm">
                    <label>Oraș:</label>
                    <select id="oras"></select>

                    <label>Cartier:</label>
                    <select id="cartier"></select>

                    <label>Zonă Colectare / Depozitare:</label>
                    <select id="zona_depozitare"></select>

                    <label>Categorie deșeuri:</label>
                    <select id="categorie">
                        <option value="Menajer">Menajer</option>
                        <option value="Hartie">Hârtie / Carton</option>
                        <option value="Plastic">Plastic / Metal</option>
                    </select>

                    <button type="submit">Trimite Raport</button>
                </form>
                <p><a href="dashboard.html">Mergi la Dashboard Primărie -></a></p>`;
            const orasSelect = document.getElementById('oras');
            const cartierSelect = document.getElementById('cartier');
            const zonaSelect = document.getElementById('zona_depozitare');

            Object.keys(structuraLocatii).forEach(oras => {
                orasSelect.innerHTML += `<option value="${oras}">${oras}</option>`;
            })

            function actualizeazaCartiere() {
                const orasSelectat = orasSelect.value;
                cartierSelect.innerHTML = "";
                Object.keys(structuraLocatii[orasSelectat]).forEach(cartier => {
                    cartierSelect.innerHTML += `<option value="${cartier}">${cartier}</option>`;
                });
                actualizeazaZone();
            }

            function actualizeazaZone() {
                const orasSelectat = orasSelect.value;
                const cartierSelectat = cartierSelect.value;
                zonaSelect.innerHTML = "";
                structuraLocatii[orasSelectat][cartierSelectat].forEach(zona => {
                    zonaSelect.innerHTML += `<option value="${zona}">${zona}</option>`;
                });
            }
        orasSelect.addEventListener('change', () =>{actualizeazaCartiere();loadLiveTable();});
        cartierSelect.addEventListener('change', actualizeazaZone);
        actualizeazaCartiere();

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                oras: orasSelect.value,
                cartier: cartierSelect.value,
                zona_depozitare: zonaSelect.value,
                categorie: document.getElementById('categorie').value
            };

            const response = await fetch('api.php?action=add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const textInitial = btnSubmit.innerText;

            btnSubmit.innerText = "Trimis! " + result.message;
            btnSubmit.style.background = "#218838";

            setTimeout(() => {
                btnSubmit.innerText = textInitial;
                btnSubmit.style.background = "";
            }, 2000);
            loadLiveTable();
        });

        }

        async function loadLiveTable() {
            try{
                const response = await fetch('api.php?action=live_table');
            const dataToate = await response.json();

            const tabelDiv = document.getElementById('tabel-live');
            tabelDiv.innerHTML = '';

            const orasSelect = document.getElementById('oras');
            if (!orasSelect) return;
            const orasCurent = orasSelect.value;

            const data = dataToate.filter(item => item.oras === orasCurent);

            if (data.length === 0) {

                tabelDiv.innerHTML = '<p> Nu sunt rapoarte inregistrate aici</p>';
                return;
            }
            const rapoarteCartiere = {};
            data.forEach(item => {
                if (!rapoarteCartiere[item.cartier]) rapoarteCartiere[item.cartier] = 0;
                rapoarteCartiere[item.cartier] += parseInt(item.nerezolvate);
            });

            let campion = null;
            let minNerezolvate = Infinity;
            for (const [cartier, nerezolvate] of Object.entries(rapoarteCartiere)) {
                if (nerezolvate < minNerezolvate) {
                    minNerezolvate = nerezolvate;
                    campion = cartier;
                }
            }

            if (campion) {
                tabelDiv.innerHTML += `
                <div class="campion-banner">
                    Campionul curateniei: <span> ${campion.toUpperCase()}</span>
                    <div style="font-size: 12px; font-weight: normal; margin-top: 5px;"></div>
                </div>`
            }

            data.sort((a, b) => b.total - a.total);
            const maxTotalGlobal = data[0].total;
            const listaZone = document.createElement('div');

            data.forEach((item, index) => {
                const lungimeBaraFataDeMax = (item.total / maxTotalGlobal) * 100;
                const procentNerezolvate = (item.nerezolvate / item.total) * 100;
                const procentRezolvate = (item.rezolvate / item.total) * 100;

                const rand = document.createElement('div');
                rand.className = 'rand-tabel';
                if (index >= 10) rand.classList.add('rand-ascuns', 'ascuns');

                rand.innerHTML = `
                    <div class="eticheta-zona">
                        ${item.zona_depozitare}
                        <div style="font-size: 11px; color: #777; margin-top: 3px;">${item.cartier}</div>
                    </div>
                    <div class="spatiu-bara">
                        <div class="bara-totala" style="width: ${lungimeBaraFataDeMax}%;">
                            <div class="felie-albastra" style="width: ${procentNerezolvate}%;" title="${item.nerezolvate} nerezolvate"></div>
                            <div class="felie-verde" style="width: ${procentRezolvate}%;" title="${item.rezolvate} rezolvate"></div>
                        </div>
                    </div>
                    <div class="total-text">${item.total}</div>
                `;
                listaZone.appendChild(rand);

            });

            tabelDiv.appendChild(listaZone);

            if (data.length > 10) {
                const btnMaiMult = document.createElement('button');
                btnMaiMult.className = 'buton-afisare';
                btnMaiMult.innerText = `Vezi toate cele ${data.length} zone raportate`;

                btnMaiMult.addEventListener('click', () => {
                    const ascunse = listaZone.querySelectorAll('.rand-ascuns');
                    const isAscuns = ascunse[0].classList.contains('ascuns');
                    ascunse.forEach(el => el.classList.toggle('ascuns'));
                    btnMaiMult.innerText = isAscuns ? 'Acunde topul' : `Vezi toate cele ${data.length} zone raportate`
                });
                tabelDiv.appendChild(btnMaiMult);
            }
        }catch (eroare) {
                console.error("Am prins o eroare invizibilă: ", eroare);}
        }//loadLiveTable

        renderForm();
        loadLiveTable();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>GaMon - Autentificare</title>
    <style>
        body { font-family: Arial, sans-serif; background: antiquewhite; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Conectare GaMon</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Utilizator" required>
        <input type="password" id="password" placeholder="Parola" required>
        <button type="submit">Intră în cont</button>
    </form>
    <p id="error" style="color: red; text-align: center;"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('api.php?action=login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (data.status === 'success') {
            localStorage.setItem('user', JSON.stringify(data.user));
            if (data.user.role === 'primarie') window.location.href = 'primarie.html';
            if (data.user.role === 'salubris') window.location.href = 'salubris.html';
        } else {
            document.getElementById('error').innerText = data.message;
        }
    });
</script>
</body>
</html>
